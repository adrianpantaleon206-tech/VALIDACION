<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Completo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card-bg: #0b1120;
      --text: #ffffff;
      --text-muted: #cbd5e1;
      --primary: #3b82f6;
      --error: #fb7185;
      --success: #34d399;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    .glow-1, .glow-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
    }
    .glow-1 { width: 350px; height: 350px; background: #1d4ed8; top: -50px; left: -50px; opacity: 0.6; }
    .glow-2 { width: 400px; height: 400px; background: #0284c7; bottom: -50px; right: -50px; opacity: 0.5; }

    .card {
      position: relative;
      z-index: 1;
      background-color: rgba(11, 17, 32, 0.90);
      backdrop-filter: blur(20px);
      width: 100%;
      max-width: 560px;
      padding: 3rem 2.5rem 2rem 2.5rem;
      border-radius: 1.5rem;
      border: 1px solid rgba(59, 130, 246, 0.3);
      box-shadow: 0 0 35px rgba(59, 130, 246, 0.2), inset 0 0 20px rgba(59, 130, 246, 0.08);
    }

    .header { margin-bottom: 2.2rem; text-align: center; }
    .header h2 { 
      font-size: 2.1rem; 
      font-weight: 800; 
      margin-bottom: 0.5rem;
      color: #fff;
      text-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
      letter-spacing: -0.02em;
    }
    .header p { color: var(--text-muted); font-size: 1.05rem; font-weight: 500; }

    .group { margin-bottom: 1.5rem; position: relative; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    .input-combined { display: grid; grid-template-columns: 100px 1fr; gap: 0.6rem; }
    .phone-combined { display: grid; grid-template-columns: 155px 1fr; gap: 0.6rem; }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #93c5fd;
    }

    input, select {
      width: 100%;
      padding: 1rem 1.1rem;
      background-color: rgba(3, 7, 18, 0.8);
      border: 2px solid var(--border);
      border-radius: 0.75rem;
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 600;
      outline: none;
      transition: all 0.25s ease;
    }

    select option { background-color: #0f172a; color: #ffffff; font-size: 1rem; }
    input::placeholder { color: #64748b; font-weight: 500; }

    input:focus, select:focus { 
      border-color: var(--primary) !important; 
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.5) !important;
    }

    .group.error input, .group.error select { 
      border-color: var(--error) !important; 
      box-shadow: 0 0 10px rgba(251, 113, 133, 0.4) !important; 
    }
    .group.success input, .group.success select { 
      border-color: var(--success) !important; 
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.3) !important; 
    }

    .msg-error {
      color: var(--error);
      font-size: 0.875rem;
      font-weight: 600;
      margin-top: 0.4rem;
      display: block;
      min-height: 1.2em;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .group.error .msg-error { opacity: 1; }

    .btn-submit {
      width: 100%;
      padding: 1.15rem;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 1rem;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
      letter-spacing: 0.02em;
    }

    .btn-submit:hover { 
      background: linear-gradient(135deg, #60a5fa, #2563eb); 
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.8);
    }
    .btn-submit:active { transform: scale(0.98); }

    .footer-autor {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(51, 65, 85, 0.5);
      padding-top: 1rem;
      letter-spacing: 0.05em;
    }
    .footer-autor span { color: #93c5fd; font-weight: 700; }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="card">
    <div class="header">
      <h2>Registro de Usuario</h2>
      <p>Ingresa tus datos personales de contacto</p>
    </div>

    <form id="registroForm" novalidate>
      <div class="row">
        <div class="group" id="group-nombre">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Juan">
          <span class="msg-error"></span>
        </div>

        <div class="group" id="group-apellido">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" placeholder="Pérez">
          <span class="msg-error"></span>
        </div>
      </div>

      <div class="group" id="group-correo">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" placeholder="correo@ejemplo.com">
        <span class="msg-error"></span>
      </div>

      <div class="row">
        <div class="group" id="group-password">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••">
          <span class="msg-error"></span>
        </div>

        <div class="group" id="group-confirmPassword">
          <label for="confirmPassword">Confirmar Clave</label>
          <input type="password" id="confirmPassword" placeholder="••••••••">
          <span class="msg-error"></span>
        </div>
      </div>

      <div class="group" id="group-cedula">
        <label for="cedula">Cédula / Documento</label>
        <div class="input-combined">
          <select id="tipoCedula">
            <option value="V">V-</option>
            <option value="E">E-</option>
            <option value="J">J-</option>
            <option value="P">P-</option>
          </select>
          <input type="text" id="cedula" placeholder="12345678" maxlength="10">
        </div>
        <span class="msg-error"></span>
      </div>

      <div class="group" id="group-pais">
        <label for="pais">País de Residencia</label>
        <select id="pais">
          <option value="">Selecciona tu país</option>
        </select>
        <span class="msg-error"></span>
      </div>

      <div class="group" id="group-telefono">
        <label for="telefono">Número Telefónico</label>
        <div class="phone-combined">
          <select id="codigoPais">
            <option value="">Código</option>
          </select>
          <input type="tel" id="telefono" placeholder="4121234567">
        </div>
        <span class="msg-error"></span>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Completar Registro</button>
    </form>

    <div class="footer-autor">
      Desarrollado por <span>Adrian Pantaleon</span>
    </div>
  </div>

        validarCampo('telefono');
      });

      inputs.pais.addEventListener('change', () => {
        const selectedOption = inputs.pais.options[inputs.pais.selectedIndex];
        const prefijo = selectedOption.dataset.prefijo;
        if (prefijo) {
          inputs.codigoPais.value = prefijo;
        } else {
          inputs.codigoPais.value = "";
        }
        validarCampo('pais');
        validarCampo('telefono');
      });

      ['nombre', 'apellido', 'correo', 'password', 'confirmPassword', 'cedula', 'telefono'].forEach(campo => {
        if (inputs[campo]) {
          inputs[campo].addEventListener('input', () => validarCampo(campo));
        }
      });

      ['codigoPais', 'tipoCedula'].forEach(campo => {
        if (inputs[campo]) {
          inputs[campo].addEventListener('change', () => {
            if (campo === 'codigoPais') validarCampo('telefono');
            else if (campo === 'tipoCedula') validarCampo('cedula');
          });
        }
      });

      function validarCampo(campo) {
        const group = document.getElementById(`group-${campo}`);
        if (!group) return true;
        
        const val = inputs[campo].value.trim();
        let error = '';

        switch (campo) {
          case 'nombre':
          case 'apellido':
            if (!val) error = 'Campo requerido.';
            else if (!/^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]{2,}$/.test(val)) error = 'Solo letras válidas.';
            break;

          case 'correo':
            if (!val) error = 'Correo requerido.';
            else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) error = 'Correo inválido.';
            break;

          case 'password':
            if (!val) error = 'Contraseña requerida.';
            else if (val.length < 6) error = 'Mínimo 6 caracteres.';
            break;

          case 'confirmPassword':
            if (!val) error = 'Confirma tu contraseña.';
            else if (val !== inputs.password.value) error = 'Las contraseñas no coinciden.';
            break;

          case 'cedula':
            if (!val) error = 'Documento requerido.';
            else if (val.length < 6 || val.length > 9) error = 'Inválido (6 a 9 dígitos).';
            break;

          case 'pais':
            if (!val) error = 'Selecciona un país.';
            break;

          case 'telefono':
            if (!inputs.codigoPais.value) error = 'Selecciona el código.';
            else if (!val) error = 'Número requerido.';
            else if (val.length < 7 || val.length > 12) error = 'Número incompleto.';
            break;
        }

        const msgEl = group.querySelector('.msg-error');

        if (error) {
          group.classList.add('error');
          group.classList.remove('success');
          if (msgEl) msgEl.textContent = error;
          return false;
        } else {
          group.classList.remove('error');
          group.classList.add('success');
          if (msgEl) msgEl.textContent = '';
          return true;
        }
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const campos = ['nombre', 'apellido', 'correo', 'password', 'confirmPassword', 'cedula', 'pais', 'telefono'];
        const resultados = campos.map(campo => validarCampo(campo));
        const esValido = resultados.every(res => res === true);

        if (esValido) {
          btnSubmit.textContent = 'Enviando...';
          btnSubmit.style.opacity = '0.7';
          btnSubmit.disabled = true;

          setTimeout(() => {
            mostrarAlertaExito();
            form.reset();
            campos.forEach(campo => {
              const g = document.getElementById(`group-${campo}`);
              if(g) g.classList.remove('success', 'error');
            });
            btnSubmit.textContent = 'Completar Registro';
            btnSubmit.style.opacity = '1';
            btnSubmit.disabled = false;
          }, 1000);
        }
      });

      function mostrarAlertaExito() {
        const modal = document.createElement('div');
        modal.style.cssText = `
          position: fixed; top: 0; left: 0; width: 100%; height: 100%;
          background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(10px);
          display: grid; place-items: center; z-index: 9999;
        `;

        modal.innerHTML = `
          <div style="background: #0b1120; border: 1px solid #34d399; padding: 2.5rem; border-radius: 1.2rem; text-align: center; max-width: 380px; box-shadow: 0 0 35px rgba(52, 211, 153, 0.4);">
            <h3 style="color: #fff; font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;">¡Registro Exitoso!</h3>
            <p style="color: #cbd5e1; font-size: 0.95rem; margin-bottom: 1.5rem;">Tus datos han sido validados y registrados correctamente.</p>
            <button id="btnCerrarModal" style="background: #34d399; color: #030712; border: none; padding: 0.8rem 1.5rem; font-weight: 800; border-radius: 0.6rem; cursor: pointer; font-size: 1rem; width: 100%;">Aceptar</button>
          </div>
        `;

        document.body.appendChild(modal);
        document.getElementById('btnCerrarModal').addEventListener('click', () => modal.remove());
      }
    });
  </script>
</body>
</html>
