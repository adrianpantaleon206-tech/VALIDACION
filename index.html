<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación Telefónica Profundo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* VARIABLES Y ESTILOS BASE */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-body: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --border-focus: #2563eb;
      --error: #ef4444;
      --error-bg: #fef2f2;
      --success: #10b981;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      display: min-height;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    /* CONTENEDOR TIPO TARJETA */
    .card {
      background: var(--surface);
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }

    .card-header { margin-bottom: 24px; }
    .card-header h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 6px; }
    .card-header p { font-size: 0.875rem; color: var(--text-muted); }

    /* ESTRUCTURA DEL FORMULARIO */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-main);
    }

    /* INPUT GROUP: UNE EL SELECT Y EL INPUT EN UN SOLO BLOQUE VISUAL */
    .input-group {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-group:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* ESTILOS PARA EL SELECT DE PAÍS */
    select {
      border: none;
      background-color: #f1f5f9;
      padding: 0 12px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      border-right: 1px solid var(--border);
      outline: none;
    }

    /* ESTILOS PARA EL CAMPO DE TEXTO DEL TELÉFONO */
    input[type="tel"] {
      flex: 1;
      border: none;
      padding: 12px 14px;
      font-size: 0.95rem;
      outline: none;
      color: var(--text-main);
      width: 100%;
    }

    /* ESTADOS DE VALIDACIÓN */
    .input-group.invalid {
      border-color: var(--error) !important;
      background-color: var(--error-bg);
    }

    /* MENSAJE DE ERROR/PIE */
    .feedback {
      font-size: 0.75rem;
      min-height: 18px;
      color: var(--error);
      font-weight: 500;
    }

    /* BOTÓN */
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover { background-color: var(--primary-hover); }
  </style>
</head>
<body>

  <main class="card">
    <header class="card-header">
      <h2>Validación de Teléfono</h2>
      <p>Selecciona tu país e ingresa tu número móvil.</p>
    </header>

    <form id="phoneForm" novalidate>
      <div class="form-group">
        <label for="phoneNumber">Número telefónico</label>
        
        <div class="input-group" id="inputGroup">
          <!-- Selector de Código de País -->
          <select id="countryCode" name="countryCode" aria-label="Código de país">
            <option value="+58" data-pattern="^[0-9]{10}$" data-hint="10 dígitos numéricos">🇻🇪 +58</option>
            <option value="+1"  data-pattern="^[0-9]{10}$" data-hint="10 dígitos numéricos">🇺🇸 +1</option>
            <option value="+34" data-pattern="^[0-9]{9}$"  data-hint="9 dígitos numéricos">🇪🇸 +34</option>
            <option value="+52" data-pattern="^[0-9]{10}$" data-hint="10 dígitos numéricos">🇲🇽 +52</option>
            <option value="+57" data-pattern="^[0-9]{10}$" data-hint="10 dígitos numéricos">🇨🇴 +57</option>
            <option value="+54" data-pattern="^[0-9]{10,11}$" data-hint="10 a 11 dígitos">🇦🇷 +54</option>
          </select>

          <!-- Input con Expresión Regular HTML nativa en 'pattern' -->
          <input 
            type="tel" 
            id="phoneNumber" 
            name="phoneNumber" 
            placeholder="4121234567" 
            pattern="^[0-9]{10}$" 
            required 
            autocomplete="tel-national"
            aria-describedby="phoneFeedback"
          />
        </div>

        <!-- Zona para mensajes dinámicos de error (Accesible vía ARIA) -->
        <span id="phoneFeedback" class="feedback" aria-live="polite"></span>
      </div>

      <button type="submit" class="btn-submit">Enviar Datos</button>
    </form>
  </main>

  <script>
    // JS Mínimo para mantener sincronizado el patrón del HTML con las opciones seleccionadas
    const countrySelect = document.getElementById('countryCode');
    const phoneInput = document.getElementById('phoneNumber');
    const inputGroup = document.getElementById('inputGroup');
    const feedback = document.getElementById('phoneFeedback');

    function syncPattern() {
      const selectedOption = countrySelect.options[countrySelect.selectedIndex];
      const regexPattern = selectedOption.getAttribute('data-pattern');
      const hint = selectedOption.getAttribute('data-hint');

      // Actualizar atributos HTML dinámicamente
      phoneInput.setAttribute('pattern', regexPattern);
      phoneInput.setAttribute('title', `Formato requerido: ${hint}`);
      
      validateField();
    }

    function validateField() {
      const pattern = new RegExp(phoneInput.getAttribute('pattern'));
      const val = phoneInput.value.trim();

      if (!val) {
        inputGroup.classList.remove('invalid');
        feedback.textContent = '';
        return true;
      }

      // Validación con RegEx en JavaScript
      if (!pattern.test(val)) {
        inputGroup.classList.add('invalid');
        const hint = countrySelect.options[countrySelect.selectedIndex].getAttribute('data-hint');
        feedback.textContent = `Formato inválido. Requiere: ${hint}`;
        return false;
      } else {
        inputGroup.classList.remove('invalid');
        feedback.textContent = '';
        return true;
      }
    }

    countrySelect.addEventListener('change', syncPattern);
    phoneInput.addEventListener('input', validateField);

    document.getElementById('phoneForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (validateField() && phoneInput.value.trim() !== '') {
        alert(`Teléfono correcto: ${countrySelect.value} ${phoneInput.value}`);
      } else {
        validateField();
        if(!phoneInput.value) feedback.textContent = 'Este campo es obligatorio.';
      }
    });

    // Inicializar al cargar
    syncPattern();
  </script>
</body>
</html>
